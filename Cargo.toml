[package]
name = "mcp-hechms"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
encoding_rs = "0.8.44"
libloading = "0.9.0"
rmcp = { version = "3.9", features = ["server", "transport-io"] }
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "process", "sync", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
